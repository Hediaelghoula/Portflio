    </g>

    <!-- laptop base -->
    <path d="M-34 432 H754 L782 464 H-62 Z" fill="#0b1a26" stroke="#ffffff" stroke-opacity=".1"/>
    <rect x="286" y="444" width="120" height="8" rx="4" fill="#182f40"/>
