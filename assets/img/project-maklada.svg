<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Application web de gestion des équipements informatiques">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111c"/>
      <stop offset=".6" stop-color="#081827"/>
      <stop offset="1" stop-color="#0a2030"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2032"/>
      <stop offset="1" stop-color="#081521"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#67e8f9" stroke-opacity=".07"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect width="1200" height="720" fill="url(#grid)"/>
  <circle cx="1040" cy="110" r="230" fill="#3b82f6" opacity=".18" filter="url(#soft)"/>
  <circle cx="170" cy="640" r="220" fill="#22d3ee" opacity=".12" filter="url(#soft)"/>

  <!-- server rack -->
  <g transform="translate(886 96)" filter="url(#shadow)">
    <rect width="200" height="300" rx="16" fill="#0b1a28" stroke="#ffffff" stroke-opacity=".12"/>
    <g font-family="Consolas, monospace" font-size="9">
      <g transform="translate(16 20)">
        <rect width="168" height="38" rx="6" fill="#10293b" stroke="#22d3ee" stroke-opacity=".25"/>
        <circle cx="14" cy="19" r="3" fill="#34d399"/>
        <text x="28" y="23" fill="#8fb8c9">SRV-01</text>
        <text x="152" y="23" text-anchor="end" fill="#4e7487">OK</text>
      </g>
      <g transform="translate(16 68)">
        <rect width="168" height="38" rx="6" fill="#10293b" stroke="#22d3ee" stroke-opacity=".25"/>
        <circle cx="14" cy="19" r="3" fill="#34d399"/>
        <text x="28" y="23" fill="#8fb8c9">SRV-02</text>
        <text x="152" y="23" text-anchor="end" fill="#4e7487">OK</text>
      </g>
      <g transform="translate(16 116)">
        <rect width="168" height="38" rx="6" fill="#10293b" stroke="#22d3ee" stroke-opacity=".25"/>
        <circle cx="14" cy="19" r="3" fill="#f59e0b"/>
        <text x="28" y="23" fill="#8fb8c9">NAS-01</text>
        <text x="152" y="23" text-anchor="end" fill="#fbbf24">SYNC</text>
      </g>
      <g transform="translate(16 164)">
        <rect width="168" height="38" rx="6" fill="#10293b" stroke="#22d3ee" stroke-opacity=".25"/>
        <circle cx="14" cy="19" r="3" fill="#34d399"/>
        <text x="28" y="23" fill="#8fb8c9">SW-01</text>
        <text x="152" y="23" text-anchor="end" fill="#4e7487">48P</text>
      </g>
      <g transform="translate(16 212)">
        <rect width="168" height="38" rx="6" fill="#10293b" stroke="#22d3ee" stroke-opacity=".25"/>
        <circle cx="14" cy="19" r="3" fill="#34d399"/>
        <text x="28" y="23" fill="#8fb8c9">FW-01</text>
        <text x="152" y="23" text-anchor="end" fill="#4e7487">UP</text>
      </g>
    </g>
    <g transform="translate(16 264)">
      <rect width="168" height="18" rx="9" fill="#10293b"/>
      <rect width="122" height="18" rx="9" fill="url(#blue)" opacity=".7"/>
