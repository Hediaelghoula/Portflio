        <text x="16" y="192">IT-0146</text>
        <text x="92" y="192">Lenovo ThinkCentre</text>
        <text x="270" y="192">Accueil</text>
        <text x="376" y="192">A. Gharbi</text>
        <text x="474" y="192" fill="#34d399">Actif</text>
