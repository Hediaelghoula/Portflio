        <text x="92" y="56">Dell Latitude 5540</text>
        <text x="270" y="56">Direction</text>
        <text x="376" y="56">M. Trabelsi</text>
        <text x="474" y="56" fill="#34d399">Actif</text>
        <text x="16" y="90">IT-0143</text>
        <text x="92" y="90">HP EliteBook 840</text>
        <text x="270" y="90">Comptabilité</text>
        <text x="376" y="90">S. Ben Ali</text>
        <text x="474" y="90" fill="#34d399">Actif</text>
        <text x="16" y="124">IT-0144</text>
        <text x="92" y="124">Cisco Catalyst 9200</text>
