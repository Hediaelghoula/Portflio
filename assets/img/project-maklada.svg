        <text x="92" y="21">ÉQUIPEMENT</text>
        <text x="270" y="21">SERVICE</text>
        <text x="376" y="21">UTILISATEUR</text>
        <text x="474" y="21">ÉTAT</text>
      </g>
      <g font-size="10" fill="#cfe7f1">
