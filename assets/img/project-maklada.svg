      <rect width="516" height="210" rx="12" fill="#0b1c29" stroke="#ffffff" stroke-opacity=".05"/>
      <rect width="516" height="32" rx="12" fill="#ffffff" fill-opacity=".03"/>
      <g fill="#6b8a9c" font-size="8" letter-spacing=".5">
