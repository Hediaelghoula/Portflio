  <!-- floating cards -->
  <g transform="translate(838 440)" filter="url(#shadow)">
    <rect width="250" height="126" rx="16" fill="#0b1a28" stroke="#22d3ee" stroke-opacity=".25"/>
    <text x="18" y="30" fill="#7f9db0" font-family="Segoe UI, Arial, sans-serif" font-size="9" letter-spacing=".6">AFFECTATION</text>
    <text x="18" y="58" fill="#e6f6fb" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Direction · 2e étage</text>
    <g transform="translate(18 74)">
      <circle cx="12" cy="12" r="12" fill="#3b82f6" opacity=".25"/>
      <text x="12" y="16" text-anchor="middle" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="700">MT</text>
      <text x="32" y="10" fill="#cfe7f1" font-family="Segoe UI, Arial, sans-serif" font-size="10">M. Trabelsi</text>
      <text x="32" y="23" fill="#5d7f92" font-family="Segoe UI, Arial, sans-serif" font-size="8">Signé · 12/06/2023</text>
      <rect x="180" y="2" width="44" height="20" rx="10" fill="#34d399" opacity=".14"/>
      <text x="202" y="16" text-anchor="middle" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="8">PDF</text>
