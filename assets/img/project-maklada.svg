      <circle cx="24" cy="132" r="3" fill="#22d3ee"/>
      <text x="36" y="136" fill="#bdf0fa" font-weight="600">Inventaire</text>
      <circle cx="24" cy="166" r="3" fill="#4e6d7e"/>
      <text x="36" y="170" fill="#8aa9b9">Affectations</text>
      <circle cx="24" cy="196" r="3" fill="#4e6d7e"/>
      <text x="36" y="200" fill="#8aa9b9">Maintenance</text>
      <circle cx="24" cy="226" r="3" fill="#4e6d7e"/>
      <text x="36" y="230" fill="#8aa9b9">Fournisseurs</text>
      <circle cx="24" cy="256" r="3" fill="#4e6d7e"/>
      <text x="36" y="260" fill="#8aa9b9">Rapports</text>
