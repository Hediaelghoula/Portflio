  <g transform="translate(828 590)" filter="url(#shadow)">
    <rect width="260" height="52" rx="26" fill="#0b1a28" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="26" cy="26" r="6" fill="#22d3ee"/>
    <text x="44" y="23" fill="#cfe7f1" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">Laravel · PostgreSQL</text>
    <text x="44" y="38" fill="#5d7f92" font-family="Consolas, monospace" font-size="9">STAGE · MAKLADA · 2023</text>
