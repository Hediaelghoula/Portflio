  <text x="92" y="646" fill="#e6f6fb" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">Un parc informatique enfin sous contrôle</text>
  <text x="92" y="672" fill="#6b8a9c" font-family="Segoe UI, Arial, sans-serif" font-size="13">Inventaire · Affectations · Maintenance · Reporting</text>
