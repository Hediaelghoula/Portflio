<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Application web et mobile de gestion des services d'entretien automobile">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset=".55" stop-color="#0c1426"/>
      <stop offset="1" stop-color="#111c36"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101c30"/>
      <stop offset="1" stop-color="#0a1322"/>
    </linearGradient>
    <pattern id="lines" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0 V40" stroke="#38bdf8" stroke-opacity=".06"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect width="1200" height="720" fill="url(#lines)"/>
  <circle cx="980" cy="140" r="240" fill="#6366f1" opacity=".2" filter="url(#soft)"/>
  <circle cx="180" cy="620" r="220" fill="#38bdf8" opacity=".12" filter="url(#soft)"/>

  <!-- calendar page -->
  <g transform="translate(112 110)" filter="url(#shadow)">
    <rect width="620" height="430" rx="22" fill="#0b1425" stroke="#ffffff" stroke-opacity=".11"/>
    <rect width="620" height="66" rx="22" fill="#ffffff" fill-opacity=".03"/>
    <text x="26" y="41" fill="#e8f1ff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">AutoCare</text>
    <text x="126" y="41" fill="#7b90ad" font-family="Segoe UI, Arial, sans-serif" font-size="11">Gestion des services d'entretien</text>
    <g transform="translate(488 20)">
      <rect width="106" height="28" rx="14" fill="#38bdf8" opacity=".14"/>
      <text x="53" y="18" text-anchor="middle" fill="#7dd3fc" font-family="Consolas, monospace" font-size="9">JUIN 2025</text>
    </g>

    <!-- weekday header -->
    <g fill="#657a96" font-family="Consolas, monospace" font-size="9" letter-spacing="1">
      <text x="46" y="100">LUN</text>
      <text x="128" y="100">MAR</text>
      <text x="210" y="100">MER</text>
      <text x="292" y="100">JEU</text>
      <text x="374" y="100">VEN</text>
      <text x="456" y="100">SAM</text>
      <text x="538" y="100">DIM</text>
    </g>

    <!-- calendar grid -->
    <g stroke="#ffffff" stroke-opacity=".05">
      <path d="M26 112 H594"/>
      <path d="M26 178 H594"/>
      <path d="M26 244 H594"/>
      <path d="M26 310 H594"/>
      <path d="M26 376 H594"/>
    </g>
    <g fill="#8296b0" font-family="Segoe UI, Arial, sans-serif" font-size="10">
      <text x="44" y="140">2</text>
      <text x="126" y="140">3</text>
      <text x="208" y="140">4</text>
      <text x="290" y="140">5</text>
      <text x="372" y="140">6</text>
      <text x="454" y="140">7</text>
      <text x="536" y="140">8</text>
      <text x="44" y="206">9</text>
      <text x="126" y="206">10</text>
      <text x="208" y="206">11</text>
      <text x="290" y="206">12</text>
      <text x="372" y="206">13</text>
      <text x="454" y="206">14</text>
      <text x="536" y="206">15</text>
      <text x="44" y="272">16</text>
      <text x="126" y="272">17</text>
      <text x="208" y="272">18</text>
      <text x="290" y="272">19</text>
      <text x="372" y="272">20</text>
      <text x="454" y="272">21</text>
      <text x="536" y="272">22</text>
    </g>

    <!-- appointments -->
    <g font-family="Segoe UI, Arial, sans-serif">
      <g transform="translate(38 148)">
        <rect width="72" height="22" rx="7" fill="#38bdf8" opacity=".2"/>
        <text x="8" y="15" fill="#bae6fd" font-size="8" font-weight="600">09:00 · Vidange</text>
      </g>
      <g transform="translate(120 148)">
        <rect width="72" height="22" rx="7" fill="#6366f1" opacity=".22"/>
        <text x="8" y="15" fill="#c7d2fe" font-size="8" font-weight="600">11:30 · Freins</text>
      </g>
      <g transform="translate(284 148)">
        <rect width="72" height="22" rx="7" fill="#34d399" opacity=".18"/>
        <text x="8" y="15" fill="#a7f3d0" font-size="8" font-weight="600">14:00 · Révision</text>
      </g>
      <g transform="translate(202 214)">
        <rect width="72" height="22" rx="7" fill="#f59e0b" opacity=".18"/>
        <text x="8" y="15" fill="#fde68a" font-size="8" font-weight="600">10:00 · Pneus</text>
      </g>
      <g transform="translate(448 214)">
        <rect width="72" height="22" rx="7" fill="#38bdf8" opacity=".2"/>
        <text x="8" y="15" fill="#bae6fd" font-size="8" font-weight="600">15:30 · Clim</text>
      </g>
      <g transform="translate(120 280)">
        <rect width="72" height="22" rx="7" fill="#f43f5e" opacity=".18"/>
        <text x="8" y="15" fill="#fecdd3" font-size="8" font-weight="600">08:30 · Diag.</text>
      </g>
    </g>

    <!-- car silhouette -->
    <g transform="translate(26 330)">
      <rect width="568" height="76" rx="14" fill="#0d1a2e"/>
      <g transform="translate(30 18)">
        <path d="M14 34 C14 24 24 20 40 18 L64 4 C72 -2 108 -2 122 6 L150 20 C172 22 184 26 186 36 L186 44 H14 Z"
              fill="url(#car)" opacity=".85"/>
        <path d="M76 6 L100 6 L100 20 L60 20 Z" fill="#0b1a2e" opacity=".65"/>
        <circle cx="48" cy="46" r="13" fill="#0b1425" stroke="#7dd3fc" stroke-width="2"/>
        <circle cx="48" cy="46" r="5" fill="#38bdf8"/>
        <circle cx="152" cy="46" r="13" fill="#0b1425" stroke="#7dd3fc" stroke-width="2"/>
        <circle cx="152" cy="46" r="5" fill="#38bdf8"/>
      </g>
      <text x="238" y="34" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">Peugeot 208 · AB-123-CD</text>
      <text x="238" y="52" fill="#6f87a6" font-family="Consolas, monospace" font-size="9">DERNIER ENTRETIEN · 12/05/2025 · 42 380 KM</text>
      <rect x="478" y="24" width="68" height="26" rx="13" fill="#34d399" opacity=".14"/>
      <text x="512" y="41" text-anchor="middle" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600">À JOUR</text>
    </g>
  </g>

  <!-- phone -->
  <g transform="translate(792 100)" filter="url(#shadow)">
    <rect width="238" height="470" rx="36" fill="#060c17" stroke="#ffffff" stroke-opacity=".18"/>
    <rect x="10" y="10" width="218" height="450" rx="28" fill="url(#phone)"/>
    <rect x="86" y="22" width="66" height="7" rx="3.5" fill="#213551"/>
    <text x="28" y="70" fill="#e8f1ff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Mes services</text>
    <text x="28" y="88" fill="#6f87a6" font-family="Segoe UI, Arial, sans-serif" font-size="10">Bonjour, Hedia 👋</text>
    <g transform="translate(28 104)">
      <rect width="182" height="82" rx="14" fill="#122744" stroke="#38bdf8" stroke-opacity=".25"/>
      <text x="14" y="24" fill="#7dd3fc" font-family="Consolas, monospace" font-size="9">PROCHAIN RENDEZ-VOUS</text>
      <text x="14" y="48" fill="#e8f1ff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Vidange + filtres</text>
      <text x="14" y="66" fill="#8fa8c4" font-family="Segoe UI, Arial, sans-serif" font-size="10">Jeu. 12 juin · 09:00</text>
      <rect x="134" y="44" width="36" height="22" rx="6" fill="#38bdf8" opacity=".18"/>
      <text x="152" y="59" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="8">J-2</text>
    </g>

    <g transform="translate(28 200)">
      <text x="0" y="14" fill="#8fa8c4" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">Historique</text>
      <text x="182" y="14" text-anchor="end" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="9">Tout voir</text>
    </g>

    <g transform="translate(28 224)" font-family="Segoe UI, Arial, sans-serif">
      <g>
        <rect width="182" height="62" rx="12" fill="#0e1a2c" stroke="#ffffff" stroke-opacity=".06"/>
        <circle cx="24" cy="22" r="11" fill="#34d399" opacity=".15"/>
        <path d="M18 22 L22 26 L30 18" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
        <text x="44" y="20" fill="#dbeafe" font-size="10" font-weight="600">Contrôle technique</text>
        <text x="44" y="34" fill="#6f87a6" font-size="8">Validé · 02/04/2025</text>
        <text x="44" y="50" fill="#8fa8c4" font-size="8">Centre Auto El Jem</text>
      </g>
      <g transform="translate(0 70)">
        <rect width="182" height="62" rx="12" fill="#0e1a2c" stroke="#ffffff" stroke-opacity=".06"/>
        <circle cx="24" cy="22" r="11" fill="#38bdf8" opacity=".15"/>
        <path d="M19 18 H29 V26 H19 Z M19 18 L24 22 L29 18" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
        <text x="44" y="20" fill="#dbeafe" font-size="10" font-weight="600">Remplacement pneus</text>
        <text x="44" y="34" fill="#6f87a6" font-size="8">Terminé · 18/02/2025</text>
        <text x="44" y="50" fill="#8fa8c4" font-size="8">Garage du Centre</text>
      </g>
      <g transform="translate(0 140)">
        <rect width="182" height="62" rx="12" fill="#0e1a2c" stroke="#ffffff" stroke-opacity=".06"/>
        <circle cx="24" cy="22" r="11" fill="#8b5cf6" opacity=".18"/>
        <path d="M19 26 L29 16 M19 16 H29 V26" fill="none" stroke="#c4b5fd" stroke-width="1.6"/>
        <text x="44" y="20" fill="#dbeafe" font-size="10" font-weight="600">Révision 40 000 km</text>
        <text x="44" y="34" fill="#6f87a6" font-size="8">Terminé · 12/12/2024</text>
        <text x="44" y="50" fill="#8fa8c4" font-size="8">AutoCare Partner</text>
      </g>
    </g>

    <g transform="translate(28 402)">
      <rect width="182" height="34" rx="17" fill="#38bdf8"/>
      <text x="91" y="22" text-anchor="middle" fill="#04121d" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">Réserver un service</text>
    </g>
  </g>

  <!-- tools -->
  <g transform="translate(730 596)" opacity=".9">
    <g transform="translate(0 0)">
      <rect width="46" height="46" rx="12" fill="#0e1a2c" stroke="#38bdf8" stroke-opacity=".25"/>
      <path d="M20 28 L32 16 M28 14 L34 20" stroke="#7dd3fc" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <g transform="translate(58 0)">
      <rect width="46" height="46" rx="12" fill="#0e1a2c" stroke="#6366f1" stroke-opacity=".35"/>
      <circle cx="23" cy="23" r="9" fill="none" stroke="#a5b4fc" stroke-width="2.4"/>
      <circle cx="23" cy="23" r="3" fill="#a5b4fc"/>
    </g>
    <g transform="translate(116 0)">
      <rect width="46" height="46" rx="12" fill="#0e1a2c" stroke="#34d399" stroke-opacity=".3"/>
      <path d="M16 24 L21 29 L30 18" fill="none" stroke="#6ee7b7" stroke-width="2.6" stroke-linecap="round"/>
    </g>
  </g>

  <text x="112" y="642" fill="#e8f1ff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">Prendre rendez-vous n'a jamais été aussi simple</text>
  <text x="112" y="668" fill="#6f87a6" font-family="Segoe UI, Arial, sans-serif" font-size="13">Angular · React Native / Expo · MongoDB</text>
</svg>
